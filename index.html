<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>계란을 훔치다!</title>
  <style>
    body {
      background-color: #111827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 10px;
      touch-action: manipulation;
    }
    .status-bar {
      display: flex;
      justify-content: space-around;
      background: #1f2937;
      padding: 10px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    canvas {
      background: #0f172a;
      border: 3px solid #f59e0b;
      border-radius: 10px;
      max-width: 95vw;
      max-height: 40vh;
    }
    .action-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
    }
    .btn-treadmill { background: #10b981; }
    .btn:active { opacity: 0.8; }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 50px);
      gap: 5px;
      justify-content: center;
      margin-top: 10px;
    }
    .ctrl-btn {
      width: 50px;
      height: 50px;
      font-size: 20px;
      background: #374151;
      color: white;
      border: none;
      border-radius: 8px;
    }
    .empty { visibility: hidden; }
    #baseInfo {
      margin-top: 8px;
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>
<body>

  <h1>🥚 계란을 훔치다!</h1>

  <div class="status-bar">
    <div>⚡ 이동 속도: <span id="speedVal">5</span></div>
    <div>🎒 들고 있는 알: <span id="holdingVal">없음</span></div>
  </div>

  <canvas id="gameCanvas" width="400" height="250"></canvas>

  <!-- 조작 버튼 -->
  <div class="controls">
    <div class="empty"></div>
    <button class="ctrl-btn" onclick="move('UP')">⬆️</button>
    <div class="empty"></div>
    <button class="ctrl-btn" onclick="move('LEFT')">⬅️</button>
    <button class="ctrl-btn" onclick="move('DOWN')">⬇️</button>
    <button class="ctrl-btn" onclick="move('RIGHT')">➡️</button>
  </div>

  <!-- 액션 패널 (런닝머신 & 인덱스) -->
  <div class="action-panel">
    <button class="btn btn-treadmill" onclick="runTreadmill()">🏃 런닝머신 타기<br>(속도 +2 업그레이드)</button>
    <button class="btn" onclick="hatchBaseEgg()">🐣 기지 알 부화시키기</button>
  </div>

  <div id="baseInfo">내 기지에 설치된 알: <span id="installedEgg">없음</span></div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let speed = 5;
    let holding = null;
    let installedEgg = null;
    let hatchTimer = null;

    const player = { x: 30, y: 125, size: 14 };
    const myBase = { x: 5, y: 85, w: 50, h: 80 };

    // 맵에 존재하는 알 목록 (요구 속도 설정)
    const eggs = [
      { x: 120, y: 125, name: "기본 알 🥚", reqSpeed: 5, color: "#ffffff" },
      { x: 220, y: 125, name: "정글 전갈 알 🦂", reqSpeed: 9, color: "#10b981" },
      { x: 310, y: 125, name: "코스믹 알 🌌", reqSpeed: 15, color: "#a855f7" },
      { x: 370, y: 125, name: "🔥 피닉스 알", reqSpeed: 23, color: "#ef4444" }
    ];

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 내 기지
      ctx.fillStyle = "#1e3a8a";
      ctx.fillRect(myBase.x, myBase.y, myBase.w, myBase.h);
      ctx.fillStyle = "white";
      ctx.font = "11px Arial";
      ctx.fillText("내 기지", myBase.x + 8, myBase.y + 45);

      // 알 배치 및 구역 표시
      eggs.forEach(e => {
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.arc(e.x, e.y, 12, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#9ca3af";
        ctx.font = "10px Arial";
        ctx.fillText(`속도 ${e.reqSpeed}`, e.x - 15, e.y + 25);
      });

      // 플레이어
      ctx.fillStyle = "#f59e0b";
      ctx.fillRect(player.x - 8, player.y - 8, 16, 16);

      checkCollisions();
    }

    function move(dir) {
      if (dir === 'UP' && player.y > 15) player.y -= speed;
      if (dir === 'DOWN' && player.y < canvas.height - 15) player.y += speed;
      if (dir === 'LEFT' && player.x > 15) player.x -= speed;
      if (dir === 'RIGHT' && player.x < canvas.width - 15) player.x += speed;
      draw();
    }

    function checkCollisions() {
      // 알 훔치기
      eggs.forEach(e => {
        if (!holding) {
          const dist = Math.hypot(player.x - e.x, player.y - e.y);
          if (dist < 20) {
            if (speed >= e.reqSpeed) {
              holding = e;
              document.getElementById("holdingVal").innerText = e.name;
            } else {
              alert(`이 알을 훔치려면 이동 속도가 최소 [${e.reqSpeed}] 이상이어야 합니다!\n런닝머신을 타서 속도를 올리세요!`);
              player.x -= 15; // 뒤로 튕겨남
            }
          }
        }
      });

      // 기지로 알 가져와 설치하기
      if (holding && player.x < myBase.x + myBase.w && player.y > myBase.y && player.y < myBase.y + myBase.h) {
        installedEgg = holding.name;
        holding = null;
        document.getElementById("holdingVal").innerText = "없음";
        document.getElementById("installedEgg").innerText = installedEgg + " (부화 준비 완료!)";
        alert(`기지에 [${installedEgg}]를 성공적으로 설치했습니다!`);
      }
    }

    function runTreadmill() {
      speed += 2;
      document.getElementById("speedVal").innerText = speed;
      alert(`🏃 런닝머신을 탔습니다! 현재 이동 속도: ${speed}`);
    }

    function hatchBaseEgg() {
      if (!installedEgg) {
        alert("기지에 설치된 알이 없습니다! 먼저 알을 훔쳐오세요.");
        return;
      }
      alert(`🎉 [${installedEgg}]가 부화했습니다! 도감(인덱스)이 등록되고 속도 보너스를 추가로 얻습니다!`);
      speed += 3;
      document.getElementById("speedVal").innerText = speed;
      installedEgg = null;
      document.getElementById("installedEgg").innerText = "없음";
    }

    draw();
  </script>
</body>
</html>
