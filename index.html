<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>계란을 훔치다!</title>
  <style>
    body {
      background-color: #0f172a;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      margin: 0;
      padding: 10px;
      touch-action: manipulation;
      user-select: none;
    }
    .status-bar {
      display: flex;
      justify-content: space-around;
      background: #1e293b;
      padding: 8px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      border: 1px solid #3b82f6;
    }
    canvas {
      background: #15803d;
      border: 4px solid #334155;
      border-radius: 12px;
      max-width: 95vw;
      max-height: 38vh;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
    }
    .action-panel {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 8px;
      min-height: 48px;
    }
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 13px;
    }
    .btn-treadmill { background: #10b981; }
    .btn-hatch { 
      background: #f59e0b; 
      color: #000;
      font-size: 14px;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }
    .btn:active { transform: scale(0.98); opacity: 0.9; }

    /* 가상 조이스틱 */
    .joystick-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 6px;
    }
    #joystickZone {
      width: 100px;
      height: 100px;
      background: rgba(30, 58, 138, 0.6);
      border: 3px solid #3b82f6;
      border-radius: 50%;
      position: relative;
      touch-action: none;
    }
    #joystickKnob {
      width: 40px;
      height: 40px;
      background: #60a5fa;
      border: 2px solid #ffffff;
      border-radius: 50%;
      position: absolute;
      top: 28px;
      left: 28px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <h1>🥚 계란을 훔치다!</h1>

  <div class="status-bar">
    <div>⚡ 속도: <span id="speedVal">5</span></div>
    <div>🎒 들고 있는 알: <span id="holdingVal">없음</span></div>
    <div>🔄 알 리셋: <span id="resetTimer">30</span>초</div>
  </div>

  <canvas id="gameCanvas" width="400" height="240"></canvas>

  <!-- 가상 조이스틱 -->
  <div class="joystick-container">
    <div id="joystickZone">
      <div id="joystickKnob"></div>
    </div>
  </div>

  <!-- 액션 패널 -->
  <div class="action-panel">
    <button class="btn btn-treadmill" onclick="runTreadmill()">🏃 런닝머신 타기 (속도 +2)</button>
    <button id="hatchBtn" class="btn btn-hatch" style="display: none;" onclick="hatchNearbyEgg()">🐣 알 부화시키기!</button>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let speed = 5;
    let holding = null; // 플레이어가 들고 있는 알

    // 플레이어
    const playerWorld = { x: 80, y: 120, size: 24 };

    // 내 기지 (커진 크기)
    const myBaseWorld = { x: -20, y: 20, w: 140, h: 200 };

    // 기지에 설치된 알 목록 [{ x, y, name, color, pattern, bonus, hatchEndTime, isReady }]
    const baseInstalledEggs = [];

    // 필드에 생성된 알들
    let fieldEggs = [];

    // 리셋 타이머 관련
    let lastResetTime = Date.now();
    const RESET_INTERVAL = 30000; // 30초

    // 구역 설정 (X 좌표 기준)
    const ZONES = [
      { name: "안전 구역", minX: -50, maxX: 200, bgDark: "#15803d", bgLight: "#16a34a" },
      { name: "기본 알 구역", minX: 200, maxX: 500, bgDark: "#1e3a8a", bgLight: "#1d4ed8", eggType: { name: "기본 알", reqSpeed: 5, color: "#ffffff", pattern: "#cbd5e1", hatchTime: 5, bonus: 3 } },
      { name: "정글 구역", minX: 500, maxX: 800, bgDark: "#064e3b", bgLight: "#047857", eggType: { name: "정글 전갈 알 🦂", reqSpeed: 9, color: "#10b981", pattern: "#065f46", hatchTime: 10, bonus: 5 } },
      { name: "코스믹 구역", minX: 800, maxX: 1100, bgDark: "#4c1d95", bgLight: "#5b21b6", eggType: { name: "코스믹 알 🌌", reqSpeed: 15, color: "#a855f7", pattern: "#581c87", hatchTime: 18, bonus: 8 } },
      { name: "피닉스 구역", minX: 1100, maxX: 1400, bgDark: "#7f1d1d", bgLight: "#991b1b", eggType: { name: "🔥 피닉스 알", reqSpeed: 23, color: "#ef4444", pattern: "#7f1d1d", hatchTime: 30, bonus: 15 } }
    ];

    // 이동 입력
    let moveInput = { x: 0, y: 0 };
    let nearbyEggToHatch = null; // 부화 가능한 근처 알

    // 알 무작위 스폰 함수 (구역당 최대 5개)
    function spawnFieldEggs() {
      fieldEggs = [];
      ZONES.forEach(zone => {
        if (!zone.eggType) return;
        const count = Math.floor(Math.random() * 3) + 3; // 3~5개 무작위 생성
        for (let i = 0; i < count; i++) {
          const rx = zone.minX + Math.random() * (zone.maxX - zone.minX - 60) + 30;
          const ry = 40 + Math.random() * 160;
          fieldEggs.push({
            x: rx,
            y: ry,
            ...zone.eggType
          });
        }
      });
      lastResetTime = Date.now();
    }

    // 둥근 사각형
    function drawRoundRect(x, y, width, height, radius, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + width, y, x + width, y + height, radius);
      ctx.arcTo(x + width, y + height, x, y + height, radius);
      ctx.arcTo(x, y + height, x, y, radius);
      ctx.arcTo(x, y, x + width, y, radius);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // 알 그리기
    function drawEgg(x, y, mainColor, patternColor, scale = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);

      ctx.fillStyle = mainColor;
      ctx.beginPath();
      ctx.ellipse(0, 0, 12, 16, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = patternColor;
      ctx.beginPath();
      ctx.arc(-3, -4, 2.5, 0, Math.PI * 2);
      ctx.arc(4, 2, 3, 0, Math.PI * 2);
      ctx.arc(-2, 6, 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // 나무 울타리
    function drawFence(x, y, width, height) {
      ctx.strokeStyle = "#78350f";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x, y + 8); ctx.lineTo(x + width, y + 8);
      ctx.moveTo(x, y + height - 8); ctx.lineTo(x + width, y + height - 8);
      ctx.stroke();

      ctx.fillStyle = "#b45309";
      for (let p = x; p <= x + width; p += 16) {
        ctx.fillRect(p - 2, y, 5, height);
      }
    }

    // 메인 게임 루프
    function update() {
      // 플레이어 이동
      playerWorld.x += moveInput.x * speed * 0.6;
      playerWorld.y += moveInput.y * speed * 0.6;

      if (playerWorld.x < -30) playerWorld.x = -30;
      if (playerWorld.y < 30) playerWorld.y = 30;
      if (playerWorld.y > 210) playerWorld.y = 210;

      const cameraX = playerWorld.x - 200;
      const cameraY = playerWorld.y - 120;

      // 30초 알 리셋 검사
      const elapsed = Date.now() - lastResetTime;
      const remainResetSec = Math.max(0, Math.ceil((RESET_INTERVAL - elapsed) / 1000));
      document.getElementById("resetTimer").innerText = remainResetSec;
      if (elapsed >= RESET_INTERVAL) {
        spawnFieldEggs();
      }

      // --- [구역별 색상 배경 그리기] ---
      ZONES.forEach(zone => {
        const zSX = zone.minX - cameraX;
        const zWidth = zone.maxX - zone.minX;

        // 구역 주 배경
        ctx.fillStyle = zone.bgDark;
        ctx.fillRect(zSX, 0, zWidth, canvas.height);

        // 구역 격자 패터닝
        ctx.fillStyle = zone.bgLight;
        const gridSize = 40;
        for (let x = Math.max(0, zSX); x < Math.min(canvas.width, zSX + zWidth); x += gridSize) {
          for (let y = 0; y < canvas.height; y += gridSize) {
            if ((Math.floor((x + cameraX) / gridSize) + Math.floor((y + cameraY) / gridSize)) % 2 === 0) {
              ctx.fillRect(x, y, gridSize, gridSize);
            }
          }
        }
      });

      // 내 기지
      const baseSX = myBaseWorld.x - cameraX;
      const baseSY = myBaseWorld.y - cameraY;
      ctx.fillStyle = "#a16207";
      ctx.fillRect(baseSX, baseSY, myBaseWorld.w, myBaseWorld.h);

      drawFence(baseSX, baseSY, myBaseWorld.w, 12);
      drawFence(baseSX, baseSY + myBaseWorld.h - 12, myBaseWorld.w, 12);
      drawFence(baseSX + myBaseWorld.w - 8, baseSY, 8, myBaseWorld.h);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 12px Arial";
      ctx.fillText("내 기지 🏡", baseSX + 35, baseSY + 28);

      // --- [기지 안의 알들 그리기 & 타이머/! 표시] ---
      const now = Date.now();
      nearbyEggToHatch = null; // 근처 부화 가능 알 초기화

      baseInstalledEggs.forEach(egg => {
        const eggSX = egg.x - cameraX;
        const eggSY = egg.y - cameraY;

        drawEgg(eggSX, eggSY, egg.color, egg.pattern, 0.85);

        const remainSec = Math.max(0, Math.ceil((egg.hatchEndTime - now) / 1000));

        if (remainSec > 0) {
          // 타이머 남은 초 표시
          ctx.fillStyle = "#fde047";
          ctx.font = "bold 11px Arial";
          ctx.fillText(`${remainSec}초`, eggSX - 8, eggSY - 16);
        } else {
          // 타이머 완료 시 ! 표시
          ctx.fillStyle = "#ef4444";
          ctx.font = "bold 18px Arial";
          ctx.fillText("!", eggSX - 3, eggSY - 16);

          // 플레이어가 이 알 근처에 닿았는지 체크
          const distToPlayer = Math.hypot(playerWorld.x - egg.x, playerWorld.y - egg.y);
          if (distToPlayer < 28) {
            nearbyEggToHatch = egg;
          }
        }
      });

      // 부화 버튼 표시 여부 제어 (알 근처에 있고 타이머 끝났을 때만)
      const hatchBtn = document.getElementById("hatchBtn");
      if (nearbyEggToHatch) {
        hatchBtn.style.display = "inline-block";
      } else {
        hatchBtn.style.display = "none";
      }

      // --- [필드 알들 그리기] ---
      fieldEggs.forEach(e => {
        const eggSX = e.x - cameraX;
        const eggSY = e.y - cameraY;

        drawEgg(eggSX, eggSY, e.color, e.pattern);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 10px Arial";
        ctx.fillText(`${e.name}`, eggSX - 20, eggSY + 24);
        ctx.fillText(`(속도 ${e.reqSpeed})`, eggSX - 15, eggSY + 36);
      });

      // 플레이어 (중앙 고정)
      drawRoundRect(200 - playerWorld.size/2, 120 - playerWorld.size/2, playerWorld.size, playerWorld.size, 8, "#f59e0b");

      // 들고 가는 알 머리 위 모션
      if (holding) {
        const bounce = Math.sin(Date.now() / 150) * 3;
        drawEgg(200, 120 - playerWorld.size - 8 + bounce, holding.color, holding.pattern, 0.75);
      }

      checkCollisions();
      requestAnimationFrame(update);
    }

    // 기지 안에서 알이 겹치지 않게 좌표를 계산해 주는 함수
    function getNextBaseEggPosition() {
      const startX = myBaseWorld.x + 25;
      const startY = myBaseWorld.y + 50;
      const gapX = 30;
      const gapY = 35;
      const cols = 3;

      const idx = baseInstalledEggs.length;
      const col = idx % cols;
      const row = Math.floor(idx / cols);

      return {
        x: startX + col * gapX,
        y: startY + row * gapY
      };
    }

    function checkCollisions() {
      // 필드 알 훔치기
      fieldEggs.forEach((e, index) => {
        if (!holding) {
          const dist = Math.hypot(playerWorld.x - e.x, playerWorld.y - e.y);
          if (dist < 22) {
            if (speed >= e.reqSpeed) {
              holding = e;
              document.getElementById("holdingVal").innerText = e.name;
              fieldEggs.splice(index, 1); // 필드에서 삭제
            } else {
              moveInput = { x: 0, y: 0 };
              resetJoystick();
              alert(`이 알을 훔치려면 속도가 [${e.reqSpeed}] 이상이어야 합니다!\n런닝머신을 타세요!`);
              playerWorld.x -= 20;
            }
          }
        }
      });

      // 기지로 알 들고 들어왔을 때 (다중 배치 & 겹침 방지)
      if (holding && playerWorld.x < myBaseWorld.x + myBaseWorld.w &&
          playerWorld.y > myBaseWorld.y && playerWorld.y < myBaseWorld.y + myBaseWorld.h) {

        const pos = getNextBaseEggPosition();

        baseInstalledEggs.push({
          x: pos.x,
          y: pos.y,
          name: holding.name,
          color: holding.color,
          pattern: holding.pattern,
          bonus: holding.bonus,
          hatchEndTime: Date.now() + holding.hatchTime * 1000
        });

        alert(`🏡 [${holding.name}]를 기지에 보관했습니다! (${holding.hatchTime}초 후 부화 가능)`);
        holding = null;
        document.getElementById("holdingVal").innerText = "없음";
      }
    }

    // 근처 부화 완료 알 부화 실행
    function hatchNearbyEgg() {
      if (!nearbyEggToHatch) return;

      const idx = baseInstalledEggs.indexOf(nearbyEggToHatch);
      if (idx !== -1) {
        speed += nearbyEggToHatch.bonus;
        document.getElementById("speedVal").innerText = speed;
        alert(`🎉 [${nearbyEggToHatch.name}] 부화 성공! 이동 속도가 +${nearbyEggToHatch.bonus} 대폭 증가했습니다!`);
        baseInstalledEggs.splice(idx, 1); // 기지에서 삭제
      }
    }

    function runTreadmill() {
      speed += 2;
      document.getElementById("speedVal").innerText = speed;
      alert(`🏃 런닝머신을 탔습니다! 현재 속도: ${speed}`);
    }

    /* --- 조이스틱 제어 --- */
    const joystickZone = document.getElementById("joystickZone");
    const joystickKnob = document.getElementById("joystickKnob");
    let isDragging = false;
    const maxRadius = 32;

    function handleJoystickMove(clientX, clientY) {
      const rect = joystickZone.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      let dx = clientX - centerX;
      let dy = clientY - centerY;
      const distance = Math.hypot(dx, dy);

      if (distance > maxRadius) {
        dx = (dx / distance) * maxRadius;
        dy = (dy / distance) * maxRadius;
      }

      joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
      moveInput.x = dx / maxRadius;
      moveInput.y = dy / maxRadius;
    }

    function resetJoystick() {
      isDragging = false;
      joystickKnob.style.transform = `translate(0px, 0px)`;
      moveInput = { x: 0, y: 0 };
    }

    joystickZone.addEventListener("pointerdown", (e) => {
      isDragging = true;
      joystickZone.setPointerCapture(e.pointerId);
      handleJoystickMove(e.clientX, e.clientY);
    });

    joystickZone.addEventListener("pointermove", (e) => {
      if (isDragging) handleJoystickMove(e.clientX, e.clientY);
    });

    joystickZone.addEventListener("pointerup", resetJoystick);
    joystickZone.addEventListener("pointercancel", resetJoystick);

    // 최초 필드 알 스폰 및 게임 시작
    spawnFieldEggs();
    update();
  </script>
</body>
</html>
