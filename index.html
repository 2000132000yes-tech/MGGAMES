<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>숫자 맞추기 게임</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
      background-color: #f0f8ff;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      display: inline-block;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    input {
      font-size: 18px;
      padding: 8px;
      width: 100px;
      text-align: center;
    }
    button {
      font-size: 18px;
      padding: 8px 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    #result {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎯 숫자 맞추기 게임</h1>
    <p>1부터 50 사이의 숫자를 맞춰보세요!</p>
    <input type="number" id="guessInput" min="1" max="50">
    <button onclick="checkGuess()">확인</button>
    <div id="result"></div>
  </div>

  <script>
    const randomNumber = Math.floor(Math.random() * 50) + 1;
    let count = 0;

    function checkGuess() {
      const userGuess = parseInt(document.getElementById('guessInput').value);
      const resultDiv = document.getElementById('result');
      
      if (!userGuess || userGuess < 1 || userGuess > 50) {
        resultDiv.innerText = "1부터 50 사이의 숫자를 입력해 주세요.";
        resultDiv.style.color = "orange";
        return;
      }

      count++;

      if (userGuess === randomNumber) {
        resultDiv.innerText = `🎉 정답입니다! (${count}번 만에 맞춤)`;
        resultDiv.style.color = "green";
      } else if (userGuess > randomNumber) {
        resultDiv.innerText = "DOWN! 더 작은 숫자입니다.";
        resultDiv.style.color = "red";
      } else {
        resultDiv.innerText = "UP! 더 큰 숫자입니다.";
        resultDiv.style.color = "red";
      }
    }
  </script>
</body>
</html>
