<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egg Game</title>
    <style>
        /* 하얀 배경 설정 */
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
        }

        /* 왼쪽 위 구석 달걀 버튼 스타일 */
        .egg-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: #f0f0f0;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            padding: 8px 16px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease;
        }

        /* 마우스 호버 효과 */
        .egg-btn:hover {
            background-color: #ffeaa7;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
        }

        /* 마우스 클릭 효과 */
        .egg-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- 왼쪽 위 달걀 버튼 -->
    <button class="egg-btn" onclick="eggButtonClick()">
        <span>🥚</span>
        <span>달걀</span>
    </button>

    <script>
        // 버튼 클릭 시 실행할 동작
        function eggButtonClick() {
            alert("달걀 버튼을 클릭하셨습니다!");
        }
    </script>

</body>
</html>
