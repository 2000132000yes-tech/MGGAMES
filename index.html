<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>계란을 훔치다!</title>
  <style>
    body {
      background-color: #052e16;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      margin: 0;
      padding: 10px;
      touch-action: manipulation;
      user-select: none;
    }
    .status-bar {
      display: flex;
      justify-content: space-around;
      background: #14532d;
      padding: 10px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      border: 1px solid #22c55e;
    }
    canvas {
      background: #15803d;
      border: 4px solid #166534;
      border-radius: 12px;
      max-width: 95vw;
      max-height: 38vh;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
    }
    .action-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 13px;
    }
    .btn-treadmill { background: #10b981; }
    .btn:active { transform: scale(0.98); opacity: 0.9; }

    /* 가상 조이스틱 컨테이너 */
    .joystick-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 10px;
    }
    #joystickZone {
      width: 110px;
      height: 110px;
      background: rgba(30, 58, 138, 0.6);
      border: 3px solid #3b82f6;
      border-radius: 50%;
      position: relative;
      touch-action: none;
    }
    #joystickKnob {
      width: 45px;
      height: 45px;
      background: #60a5fa;
      border: 2px solid #ffffff;
      border-radius: 50%;
      position: absolute;
      top: 30px;
      left: 30px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
    }

    #baseInfo {
      margin-top: 6px;
      font-size: 13px;
      color: #86efac;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>🥚 계란을 훔치다!</h1>

  <div class="status-bar">
    <div>⚡ 속도: <span id="speedVal">5</span></div>
    <div>🎒 들고 있는 알: <span id="holdingVal">없음</span></div>
  </div>

  <canvas id="gameCanvas" width="400" height="240"></canvas>

  <!-- 가상 조이스틱 -->
  <div class="joystick-container">
    <div id="joystickZone">
      <div id="joystickKnob"></div>
    </div>
  </div>

  <!-- 액션 패널 -->
  <div class="action-panel">
    <button class="btn btn-treadmill" onclick="runTreadmill()">🏃 런닝머신 타기<br>(속도 +2 업그레이드)</button>
    <button class="btn" onclick="hatchBaseEgg()">🐣 기지 알 부화시키기</button>
  </div>

  <div id="baseInfo">내 기지에 설치된 알: <span id="installedEgg">없음</span></div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let speed = 5;
    let holding = null;

    // 기지 설치 알 관련 변수 (타이머)
    let installedEgg = null;
    let hatchEndTime = 0;

    // 캐릭터 위치
    const playerWorld = { x: 80, y: 120, size: 24 };

    // 커진 내 기지
    const myBaseWorld = { x: -20, y: 20, w: 130, h: 200 };

    // 조이스틱 이동 입력 벡터 (-1 ~ 1)
    let moveInput = { x: 0, y: 0 };

    // 알 데이터 (알마다 고유 부화 시간 적용: hatchTime - 초 단위)
    const eggs = [
      { x: 260, y: 120, name: "기본 알", reqSpeed: 5, color: "#ffffff", pattern: "#cbd5e1", hatchTime: 5, bonus: 3 },
      { x: 500, y: 120, name: "정글 전갈 알 🦂", reqSpeed: 9, color: "#10b981", pattern: "#047857", hatchTime: 12, bonus: 5 },
      { x: 750, y: 120, name: "코스믹 알 🌌", reqSpeed: 15, color: "#a855f7", pattern: "#6b21a8", hatchTime: 25, bonus: 8 },
      { x: 1000, y: 120, name: "🔥 피닉스 알", reqSpeed: 23, color: "#ef4444", pattern: "#b91c1c", hatchTime: 45, bonus: 15 }
    ];

    // 둥근 사각형 (캐릭터)
    function drawRoundRect(x, y, width, height, radius, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + width, y, x + width, y + height, radius);
      ctx.arcTo(x + width, y + height, x, y + height, radius);
      ctx.arcTo(x, y + height, x, y, radius);
      ctx.arcTo(x, y, x + width, y, radius);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // 알 그리기 함수
    function drawEgg(x, y, mainColor, patternColor, scale = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);

      ctx.fillStyle = mainColor;
      ctx.beginPath();
      ctx.ellipse(0, 0, 14, 18, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = patternColor;
      ctx.beginPath();
      ctx.arc(-4, -5, 3, 0, Math.PI * 2);
      ctx.arc(5, 2, 4, 0, Math.PI * 2);
      ctx.arc(-2, 7, 2.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // 울타리 그리기
    function drawFence(x, y, width, height) {
      ctx.strokeStyle = "#78350f";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x, y + 8); ctx.lineTo(x + width, y + 8);
      ctx.moveTo(x, y + height - 8); ctx.lineTo(x + width, y + height - 8);
      ctx.stroke();

      ctx.fillStyle = "#b45309";
      for (let p = x; p <= x + width; p += 16) {
        ctx.fillRect(p - 2, y, 5, height);
      }
    }

    // 메인 게임 루프
    function update() {
      // 조이스틱 입력에 따른 부드러운 위치 이동
      playerWorld.x += moveInput.x * speed * 0.6;
      playerWorld.y += moveInput.y * speed * 0.6;

      // X/Y축 경계선 제한
      if (playerWorld.x < 15) playerWorld.x = 15;
      if (playerWorld.y < 20) playerWorld.y = 20;
      if (playerWorld.y > 220) playerWorld.y = 220;

      const cameraX = playerWorld.x - 200;
      const cameraY = playerWorld.y - 120;

      // 잔디밭 배경
      ctx.fillStyle = "#15803d";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#16a34a";
      const gridSize = 40;
      const startX = -(cameraX % gridSize);
      const startY = -(cameraY % gridSize);
      for (let x = startX; x < canvas.width; x += gridSize) {
        for (let y = startY; y < canvas.height; y += gridSize) {
          if ((Math.floor((x + cameraX) / gridSize) + Math.floor((y + cameraY) / gridSize)) % 2 === 0) {
            ctx.fillRect(x, y, gridSize, gridSize);
          }
        }
      }

      // 내 기지 바닥
      const baseSX = myBaseWorld.x - cameraX;
      const baseSY = myBaseWorld.y - cameraY;
      ctx.fillStyle = "#a16207";
      ctx.fillRect(baseSX, baseSY, myBaseWorld.w, myBaseWorld.h);

      drawFence(baseSX, baseSY, myBaseWorld.w, 12);
      drawFence(baseSX, baseSY + myBaseWorld.h - 12, myBaseWorld.w, 12);
      drawFence(baseSX + myBaseWorld.w - 8, baseSY, 8, myBaseWorld.h);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 13px Arial";
      ctx.fillText("내 기지 🏡", baseSX + 30, baseSY + 100);

      // 훔쳐온 알이 기지에 배치되어 있는 경우 시각화
      if (installedEgg) {
        drawEgg(baseSX + 65, baseSY + 125, installedEgg.color, installedEgg.pattern, 0.9);
      }

      // 알 배치
      eggs.forEach(e => {
        const eggSX = e.x - cameraX;
        const eggSY = e.y - cameraY;

        drawEgg(eggSX, eggSY, e.color, e.pattern);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 11px Arial";
        ctx.fillText(`${e.name}`, eggSX - 25, eggSY + 28);
        ctx.fillText(`(속도 ${e.reqSpeed} / ${e.hatchTime}초)`, eggSX - 30, eggSY + 42);
      });

      // 플레이어 (중앙 고정)
      drawRoundRect(200 - playerWorld.size/2, 120 - playerWorld.size/2, playerWorld.size, playerWorld.size, 8, "#f59e0b");

      // [핵심 디테일] 알을 들고 갈 때 머리 위에 둥둥 떠다니는 알 모션
      if (holding) {
        const bounce = Math.sin(Date.now() / 150) * 3; // 위아래로 살짝 흔들리는 효과
        drawEgg(200, 120 - playerWorld.size - 10 + bounce, holding.color, holding.pattern, 0.75);
      }

      // 부화 타이머 실시간 갱신 표시
      updateHatchUI();

      // 충돌 검사
      checkCollisions();

      requestAnimationFrame(update);
    }

    function checkCollisions() {
      // 알 훔치기
      eggs.forEach(e => {
        if (!holding) {
          const dist = Math.hypot(playerWorld.x - e.x, playerWorld.y - e.y);
          if (dist < 25) {
            if (speed >= e.reqSpeed) {
              holding = e;
              document.getElementById("holdingVal").innerText = e.name;
            } else {
              moveInput = { x: 0, y: 0 };
              resetJoystick();
              alert(`이 알을 훔치려면 속도가 [${e.reqSpeed}] 이상이어야 합니다!\n런닝머신을 타고 속도를 올려오세요!`);
              playerWorld.x -= 20;
            }
          }
        }
      });

      // 기지로 알 가지고 들어왔을 때
      if (holding && playerWorld.x < myBaseWorld.x + myBaseWorld.w &&
          playerWorld.y > myBaseWorld.y && playerWorld.y < myBaseWorld.y + myBaseWorld.h) {

        if (installedEgg) {
          alert("기지에 이미 부화 중인 알이 있습니다! 부화시킨 후 새 알을 놓으세요.");
          playerWorld.x += 15;
          return;
        }

        installedEgg = holding;
        hatchEndTime = Date.now() + holding.hatchTime * 1000;
        holding = null;

        document.getElementById("holdingVal").innerText = "없음";
        alert(`🏡 [${installedEgg.name}]를 기지에 설치했습니다! (부화까지 ${installedEgg.hatchTime}초 소요)`);
      }
    }

    // 부화 타이머 UI 갱신 함수
    function updateHatchUI() {
      const baseInfoEl = document.getElementById("installedEgg");
      if (!installedEgg) {
        baseInfoEl.innerText = "없음";
        return;
      }

      const remainSec = Math.max(0, Math.ceil((hatchEndTime - Date.now()) / 1000));
      if (remainSec > 0) {
        baseInfoEl.innerText = `${installedEgg.name} (부화까지 ${remainSec}초 남음 ⏳)`;
      } else {
        baseInfoEl.innerText = `${installedEgg.name} (🎉 부화 준비 완료! 버튼을 누르세요)`;
      }
    }

    function runTreadmill() {
      speed += 2;
      document.getElementById("speedVal").innerText = speed;
      alert(`🏃 런닝머신을 탔습니다! 현재 속도: ${speed}`);
    }

    function hatchBaseEgg() {
      if (!installedEgg) {
        alert("기지에 설치된 알이 없습니다!");
        return;
      }

      const remainSec = Math.max(0, Math.ceil((hatchEndTime - Date.now()) / 1000));
      if (remainSec > 0) {
        alert(`아직 부화 시간이 남았습니다! (${remainSec}초 남음)`);
        return;
      }

      alert(`🎉 [${installedEgg.name}] 부화 성공! 이동 속도가 +${installedEgg.bonus} 대폭 증가합니다!`);
      speed += installedEgg.bonus;
      document.getElementById("speedVal").innerText = speed;

      installedEgg = null;
      document.getElementById("installedEgg").innerText = "없음";
    }

    /* --- 조이스틱 터치/마우스 이벤트 처리 --- */
    const joystickZone = document.getElementById("joystickZone");
    const joystickKnob = document.getElementById("joystickKnob");
    let isDragging = false;
    const maxRadius = 35;

    function handleJoystickMove(clientX, clientY) {
      const rect = joystickZone.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      let dx = clientX - centerX;
      let dy = clientY - centerY;
      const distance = Math.hypot(dx, dy);

      if (distance > maxRadius) {
        dx = (dx / distance) * maxRadius;
        dy = (dy / distance) * maxRadius;
      }

      joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
      moveInput.x = dx / maxRadius;
      moveInput.y = dy / maxRadius;
    }

    function resetJoystick() {
      isDragging = false;
      joystickKnob.style.transform = `translate(0px, 0px)`;
      moveInput = { x: 0, y: 0 };
    }

    joystickZone.addEventListener("pointerdown", (e) => {
      isDragging = true;
      joystickZone.setPointerCapture(e.pointerId);
      handleJoystickMove(e.clientX, e.clientY);
    });

    joystickZone.addEventListener("pointermove", (e) => {
      if (isDragging) handleJoystickMove(e.clientX, e.clientY);
    });

    joystickZone.addEventListener("pointerup", resetJoystick);
    joystickZone.addEventListener("pointercancel", resetJoystick);

    // 키보드 조작 지원 (즉시 방향 전환)
    const keys = {};
    window.addEventListener("keydown", (e) => {
      keys[e.key] = true;
      updateKeyInput();
    });
    window.addEventListener("keyup", (e) => {
      keys[e.key] = false;
      updateKeyInput();
    });

    function updateKeyInput() {
      if (isDragging) return;
      let kx = 0, ky = 0;
      if (keys["ArrowLeft"] || keys["a"] || keys["A"]) kx -= 1;
      if (keys["ArrowRight"] || keys["d"] || keys["D"]) kx += 1;
      if (keys["ArrowUp"] || keys["w"] || keys["W"]) ky -= 1;
      if (keys["ArrowDown"] || keys["s"] || keys["S"]) ky += 1;

      moveInput.x = kx;
      moveInput.y = ky;
    }

    update();
  </script>
</body>
</html>
