<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>계란을 훔치다!</title>
  <style>
    body {
      background-color: #0f172a;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      margin: 0;
      padding: 8px;
      touch-action: manipulation;
      user-select: none;
    }
    .status-bar {
      display: flex;
      justify-content: space-around;
      background: #1e293b;
      padding: 8px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      border: 1px solid #3b82f6;
    }
    canvas {
      background: #0f172a;
      border: 4px solid #334155;
      border-radius: 12px;
      max-width: 98vw;
      max-height: 50vh;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
    }
    .action-panel {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 8px;
      min-height: 44px;
    }
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 13px;
    }
    .btn-treadmill { background: #10b981; }
    .btn-hatch { 
      background: #f59e0b; 
      color: #000;
      font-size: 14px;
      font-weight: bold;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }
    .btn:active { transform: scale(0.98); opacity: 0.9; }

    /* 가상 조이스틱 */
    .joystick-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 6px;
    }
    #joystickZone {
      width: 100px;
      height: 100px;
      background: rgba(30, 58, 138, 0.6);
      border: 3px solid #3b82f6;
      border-radius: 50%;
      position: relative;
      touch-action: none;
    }
    #joystickKnob {
      width: 40px;
      height: 40px;
      background: #60a5fa;
      border: 2px solid #ffffff;
      border-radius: 50%;
      position: absolute;
      top: 28px;
      left: 28px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <h1>🥚 계란을 훔치다!</h1>

  <div class="status-bar">
    <div>⚡ 속도: <span id="speedVal">5</span></div>
    <div>🎒 들고 있는 알: <span id="holdingVal">없음</span></div>
    <div>🔄 알 리셋: <span id="resetTimer">30</span>초</div>
  </div>

  <!-- 화면 크기 확장 (560 x 320) -->
  <canvas id="gameCanvas" width="560" height="320"></canvas>

  <!-- 가상 조이스틱 -->
  <div class="joystick-container">
    <div id="joystickZone">
      <div id="joystickKnob"></div>
    </div>
  </div>

  <!-- 액션 패널 -->
  <div class="action-panel">
    <button class="btn btn-treadmill" onclick="runTreadmill()">🏃 런닝머신 타기 (속도 +2)</button>
    <button id="hatchBtn" class="btn btn-hatch" style="display: none;" onclick="hatchNearbyEgg()">🐣 알 부화시키기!</button>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let speed = 5;
    let holding = null;

    // 플레이어 위치
    const playerWorld = { x: 100, y: 160, size: 26 };

    // 내 기지 위치 및 크기
    const myBaseWorld = { x: -10, y: 30, w: 160, h: 260 };

    // 기지에 설치된 알 목록
    const baseInstalledEggs = [];

    // 필드 알 목록
    let fieldEggs = [];

    // 타이머
    let lastResetTime = Date.now();
    const RESET_INTERVAL = 30000;

    // 맵 수직 경계 (Y축 범위 및 벽 위치)
    const MAP_LIMIT = {
      minY: 40,
      maxY: 280,
      minX: -50,
      maxX: 1950
    };

    // 구역 설정 (크기 확장 및 깔끔한 단색 적용)
    const ZONES = [
      { name: "안전 구역", minX: -50, maxX: 250, bgColor: "#15803d" },
      { name: "기본 알 구역", minX: 250, maxX: 650, bgColor: "#1e3a8a", eggType: { name: "기본 알", reqSpeed: 5, color: "#ffffff", pattern: "#cbd5e1", hatchTime: 5, bonus: 3 } },
      { name: "정글 구역", minX: 650, maxX: 1080, bgColor: "#064e3b", eggType: { name: "정글 전갈 알 🦂", reqSpeed: 9, color: "#10b981", pattern: "#065f46", hatchTime: 10, bonus: 5 } },
      { name: "코스믹 구역", minX: 1080, maxX: 1500, bgColor: "#4c1d95", eggType: { name: "코스믹 알 🌌", reqSpeed: 15, color: "#a855f7", pattern: "#581c87", hatchTime: 18, bonus: 8 } },
      { name: "피닉스 구역", minX: 1500, maxX: 1950, bgColor: "#7f1d1d", eggType: { name: "🔥 피닉스 알", reqSpeed: 23, color: "#ef4444", pattern: "#7f1d1d", hatchTime: 30, bonus: 15 } }
    ];

    let moveInput = { x: 0, y: 0 };
    let nearbyEggToHatch = null;

    // 알 생성 함수
    function spawnFieldEggs() {
      fieldEggs = [];
      ZONES.forEach(zone => {
        if (!zone.eggType) return;
        const count = Math.floor(Math.random() * 3) + 3; // 3~5개
        for (let i = 0; i < count; i++) {
          const rx = zone.minX + Math.random() * (zone.maxX - zone.minX - 80) + 40;
          const ry = MAP_LIMIT.minY + 20 + Math.random() * (MAP_LIMIT.maxY - MAP_LIMIT.minY - 40);
          fieldEggs.push({
            x: rx,
            y: ry,
            ...zone.eggType
          });
        }
      });
      lastResetTime = Date.now();
    }

    // 둥근 사각형 (플레이어)
    function drawRoundRect(x, y, width, height, radius, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + width, y, x + width, y + height, radius);
      ctx.arcTo(x + width, y + height, x, y + height, radius);
      ctx.arcTo(x, y + height, x, y, radius);
      ctx.arcTo(x, y, x + width, y, radius);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // 알 그리기
    function drawEgg(x, y, mainColor, patternColor, scale = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);

      ctx.fillStyle = mainColor;
      ctx.beginPath();
      ctx.ellipse(0, 0, 13, 17, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = patternColor;
      ctx.beginPath();
      ctx.arc(-3, -4, 2.5, 0, Math.PI * 2);
      ctx.arc(4, 2, 3, 0, Math.PI * 2);
      ctx.arc(-2, 6, 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // 울타리 그리기 (기지 전용)
    function drawFence(x, y, width, height) {
      ctx.strokeStyle = "#78350f";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x, y + 8); ctx.lineTo(x + width, y + 8);
      ctx.moveTo(x, y + height - 8); ctx.lineTo(x + width, y + height - 8);
      ctx.stroke();

      ctx.fillStyle = "#b45309";
      for (let p = x; p <= x + width; p += 16) {
        ctx.fillRect(p - 2, y, 5, height);
      }
    }

    // 외각 돌 벽 그리기 (맵 가장자리 보리)
    function drawMapWalls(cameraX, cameraY) {
      ctx.fillStyle = "#334155";
      ctx.strokeStyle = "#1e293b";
      ctx.lineWidth = 3;

      const wallThick = 25;
      const leftX = MAP_LIMIT.minX - wallThick - cameraX;
      const rightX = MAP_LIMIT.maxX - cameraX;
      const topY = MAP_LIMIT.minY - wallThick - cameraY;
      const bottomY = MAP_LIMIT.maxY - cameraY;
      const mapWidth = MAP_LIMIT.maxX - MAP_LIMIT.minX + wallThick * 2;

      // 위쪽 벽
      ctx.fillRect(leftX, topY, mapWidth, wallThick);
      ctx.strokeRect(leftX, topY, mapWidth, wallThick);

      // 아래쪽 벽
      ctx.fillRect(leftX, bottomY, mapWidth, wallThick);
      ctx.strokeRect(leftX, bottomY, mapWidth, wallThick);

      // 왼쪽 벽
      ctx.fillRect(leftX, topY, wallThick, MAP_LIMIT.maxY - MAP_LIMIT.minY + wallThick * 2);
      ctx.strokeRect(leftX, topY, wallThick, MAP_LIMIT.maxY - MAP_LIMIT.minY + wallThick * 2);

      // 오른쪽 벽
      ctx.fillRect(rightX, topY, wallThick, MAP_LIMIT.maxY - MAP_LIMIT.minY + wallThick * 2);
      ctx.strokeRect(rightX, topY, wallThick, MAP_LIMIT.maxY - MAP_LIMIT.minY + wallThick * 2);
    }

    // 메인 루프
    function update() {
      // 위치 이동
      playerWorld.x += moveInput.x * speed * 0.7;
      playerWorld.y += moveInput.y * speed * 0.7;

      // 외각 벽 충돌 및 이동 제한
      if (playerWorld.x < MAP_LIMIT.minX + 15) playerWorld.x = MAP_LIMIT.minX + 15;
      if (playerWorld.x > MAP_LIMIT.maxX - 15) playerWorld.x = MAP_LIMIT.maxX - 15;
      if (playerWorld.y < MAP_LIMIT.minY + 15) playerWorld.y = MAP_LIMIT.minY + 15;
      if (playerWorld.y > MAP_LIMIT.maxY - 15) playerWorld.y = MAP_LIMIT.maxY - 15;

      // 플레이어를 중앙(280, 160)에 배치하는 카메라 좌표
      const cameraX = playerWorld.x - 280;
      const cameraY = playerWorld.y - 160;

      // 30초 알 리셋 타이머
      const elapsed = Date.now() - lastResetTime;
      const remainResetSec = Math.max(0, Math.ceil((RESET_INTERVAL - elapsed) / 1000));
      document.getElementById("resetTimer").innerText = remainResetSec;
      if (elapsed >= RESET_INTERVAL) {
        spawnFieldEggs();
      }

      // --- [구역별 단색 배경 그리기] ---
      ZONES.forEach(zone => {
        const zSX = zone.minX - cameraX;
        const zWidth = zone.maxX - zone.minX;

        ctx.fillStyle = zone.bgColor;
        ctx.fillRect(zSX, 0, zWidth, canvas.height);
      });

      // 외곽 석재 벽 그리기
      drawMapWalls(cameraX, cameraY);

      // 내 기지
      const baseSX = myBaseWorld.x - cameraX;
      const baseSY = myBaseWorld.y - cameraY;
      ctx.fillStyle = "#a16207";
      ctx.fillRect(baseSX, baseSY, myBaseWorld.w, myBaseWorld.h);

      drawFence(baseSX, baseSY, myBaseWorld.w, 12);
      drawFence(baseSX, baseSY + myBaseWorld.h - 12, myBaseWorld.w, 12);
      drawFence(baseSX + myBaseWorld.w - 8, baseSY, 8, myBaseWorld.h);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 13px Arial";
      ctx.fillText("내 기지 🏡", baseSX + 45, baseSY + 28);

      // --- [기지 안 알들 & 타이머/! 표시] ---
      const now = Date.now();
      nearbyEggToHatch = null;

      baseInstalledEggs.forEach(egg => {
        const eggSX = egg.x - cameraX;
        const eggSY = egg.y - cameraY;

        drawEgg(eggSX, eggSY, egg.color, egg.pattern, 0.9);

        const remainSec = Math.max(0, Math.ceil((egg.hatchEndTime - now) / 1000));

        if (remainSec > 0) {
          ctx.fillStyle = "#fde047";
          ctx.font = "bold 11px Arial";
          ctx.fillText(`${remainSec}초`, eggSX - 8, eggSY - 16);
        } else {
          ctx.fillStyle = "#ef4444";
          ctx.font = "bold 20px Arial";
          ctx.fillText("!", eggSX - 3, eggSY - 16);

          const distToPlayer = Math.hypot(playerWorld.x - egg.x, playerWorld.y - egg.y);
          if (distToPlayer < 30) {
            nearbyEggToHatch = egg;
          }
        }
      });

      // 알 부화 버튼 표시 제어
      const hatchBtn = document.getElementById("hatchBtn");
      if (nearbyEggToHatch) {
        hatchBtn.style.display = "inline-block";
      } else {
        hatchBtn.style.display = "none";
      }

      // --- [필드 알들 그리기] ---
      fieldEggs.forEach(e => {
        const eggSX = e.x - cameraX;
        const eggSY = e.y - cameraY;

        drawEgg(eggSX, eggSY, e.color, e.pattern);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 11px Arial";
        ctx.fillText(`${e.name}`, eggSX - 22, eggSY + 24);
        ctx.fillText(`(속도 ${e.reqSpeed})`, eggSX - 16, eggSY + 38);
      });

      // 플레이어 (화면 중앙 280, 160 고정)
      drawRoundRect(280 - playerWorld.size/2, 160 - playerWorld.size/2, playerWorld.size, playerWorld.size, 8, "#f59e0b");

      // 들고 있는 알 머리 위 표시
      if (holding) {
        const bounce = Math.sin(Date.now() / 150) * 3;
        drawEgg(280, 160 - playerWorld.size - 8 + bounce, holding.color, holding.pattern, 0.8);
      }

      checkCollisions();
      requestAnimationFrame(update);
    }

    // 기지 알 안 겹치게 지그재그 좌표 계산
    function getNextBaseEggPosition() {
      const startX = myBaseWorld.x + 30;
      const startY = myBaseWorld.y + 55;
      const gapX = 35;
      const gapY = 40;
      const cols = 3;

      const idx = baseInstalledEggs.length;
      const col = idx % cols;
      const row = Math.floor(idx / cols);

      return {
        x: startX + col * gapX,
        y: startY + row * gapY
      };
    }

    function checkCollisions() {
      // 알 훔치기
      fieldEggs.forEach((e, index) => {
        if (!holding) {
          const dist = Math.hypot(playerWorld.x - e.x, playerWorld.y - e.y);
          if (dist < 24) {
            if (speed >= e.reqSpeed) {
              holding = e;
              document.getElementById("holdingVal").innerText = e.name;
              fieldEggs.splice(index, 1);
            } else {
              moveInput = { x: 0, y: 0 };
              resetJoystick();
              alert(`이 알을 훔치려면 속도가 [${e.reqSpeed}] 이상이어야 합니다!\n런닝머신을 타세요!`);
              playerWorld.x -= 25;
            }
          }
        }
      });

      // 기지로 보관
      if (holding && playerWorld.x < myBaseWorld.x + myBaseWorld.w &&
          playerWorld.y > myBaseWorld.y && playerWorld.y < myBaseWorld.y + myBaseWorld.h) {

        const pos = getNextBaseEggPosition();

        baseInstalledEggs.push({
          x: pos.x,
          y: pos.y,
          name: holding.name,
          color: holding.color,
          pattern: holding.pattern,
          bonus: holding.bonus,
          hatchEndTime: Date.now() + holding.hatchTime * 1000
        });

        alert(`🏡 [${holding.name}]를 기지에 보관했습니다! (${holding.hatchTime}초 후 부화 가능)`);
        holding = null;
        document.getElementById("holdingVal").innerText = "없음";
      }
    }

    // 부화 실행
    function hatchNearbyEgg() {
      if (!nearbyEggToHatch) return;

      const idx = baseInstalledEggs.indexOf(nearbyEggToHatch);
      if (idx !== -1) {
        speed += nearbyEggToHatch.bonus;
        document.getElementById("speedVal").innerText = speed;
        alert(`🎉 [${nearbyEggToHatch.name}] 부화 성공! 이동 속도가 +${nearbyEggToHatch.bonus} 대폭 증가했습니다!`);
        baseInstalledEggs.splice(idx, 1);
      }
    }

    function runTreadmill() {
      speed += 2;
      document.getElementById("speedVal").innerText = speed;
      alert(`🏃 런닝머신을 탔습니다! 현재 속도: ${speed}`);
    }

    /* --- 가상 조이스틱 이벤트 --- */
    const joystickZone = document.getElementById("joystickZone");
    const joystickKnob = document.getElementById("joystickKnob");
    let isDragging = false;
    const maxRadius = 32;

    function handleJoystickMove(clientX, clientY) {
      const rect = joystickZone.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      let dx = clientX - centerX;
      let dy = clientY - centerY;
      const distance = Math.hypot(dx, dy);

      if (distance > maxRadius) {
        dx = (dx / distance) * maxRadius;
        dy = (dy / distance) * maxRadius;
      }

      joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
      moveInput.x = dx / maxRadius;
      moveInput.y = dy / maxRadius;
    }

    function resetJoystick() {
      isDragging = false;
      joystickKnob.style.transform = `translate(0px, 0px)`;
      moveInput = { x: 0, y: 0 };
    }

    joystickZone.addEventListener("pointerdown", (e) => {
      isDragging = true;
      joystickZone.setPointerCapture(e.pointerId);
      handleJoystickMove(e.clientX, e.clientY);
    });

    joystickZone.addEventListener("pointermove", (e) => {
      if (isDragging) handleJoystickMove(e.clientX, e.clientY);
    });

    joystickZone.addEventListener("pointerup", resetJoystick);
    joystickZone.addEventListener("pointercancel", resetJoystick);

    // 실행
    spawnFieldEggs();
    update();
  </script>
</body>
</html>
