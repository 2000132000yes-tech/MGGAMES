<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>웹사이트</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body {
      background-color: #ffffff;
      padding: 20px;
      font-family: monospace, sans-serif;
    }

    /* 알 아이콘 버튼 */
    .egg-btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 50px;
      height: 50px;
      background-color: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      cursor: pointer;
      font-size: 24px;
    }

    .egg-btn:active {
      transform: scale(0.95);
      background-color: #f1f5f9;
    }

    /* 모달 배경 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.4);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    /* 팝업 창 (뷰포트) */
    .modal-content {
      position: relative;
      width: 85vw;
      height: 80vh;
      background-color: #86efac;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    /* 월드 맵 */
    .world {
      position: absolute;
      width: 2000px;
      height: 2500px;
      bottom: 0;
      left: -800px;
      background: linear-gradient(
        to top,
        #86efac 0px, #86efac 500px,       /* 1구역: 연두 */
        #22c55e 500px, #22c55e 1000px,   /* 2구역: 초록 */
        #3b82f6 1000px, #3b82f6 1500px,  /* 3구역: 파랑 */
        #a855f7 1500px, #a855f7 2000px,  /* 4구역: 보라 */
        #ffedd5 2000px, #ffedd5 2500px   /* 5구역: 살구 */
      );
    }

    /* 울타리 */
    .fence {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: repeating-linear-gradient(
        90deg,
        transparent,
        transparent 40px,
        rgba(0, 0, 0, 0.12) 40px,
        rgba(0, 0, 0, 0.12) 46px
      );
    }

    /* 울타리 위쪽에 위치한 러닝머신 오브젝트 */
    .treadmill {
      position: absolute;
      bottom: 120px; /* 울타리 위쪽 연두 구역에 설치 */
      left: 960px;   /* 시작 중앙 근처 */
      width: 80px;
      height: 100px;
      background-color: #334155;
      border: 3px solid #0f172a;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 6px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.25);
    }

    .treadmill-belt {
      width: 100%;
      height: 60px;
      background: repeating-linear-gradient(
        0deg,
        #1e293b,
        #1e293b 10px,
        #475569 10px,
        #475569 14px
      );
      border-radius: 6px;
    }

    .treadmill-screen {
      width: 60%;
      height: 14px;
      background-color: #38bdf8;
      border-radius: 4px;
      font-size: 10px;
      text-align: center;
      line-height: 14px;
    }

    /* 왼쪽 위 빨간색 X 버튼 */
    .close-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      width: 36px;
      height: 36px;
      background-color: #ef4444;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .close-btn:active {
      transform: scale(0.92);
      background-color: #dc2626;
    }

    /* 왼쪽 아래 스탯 UI (돈/신발 아이콘) */
    .stats-ui {
      position: absolute;
      bottom: 20px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
      font-weight: bold;
      font-size: 18px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6);
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-s { color: #3b82f6; } /* 파란색 S:(속도) */
    .stat-m { color: #22c55e; } /* 초록색 M:000 */

    /* 화면 중앙 고정 캐릭터 */
    .character {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 36px;
      height: 36px;
      background-color: #3b82f6;
      border: 3px solid #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transform: translate(-50%, -50%);
      z-index: 5;
    }

    /* 오른쪽 아래 조이스틱 */
    .joystick-base {
      position: absolute;
      bottom: 25px;
      right: 25px;
      width: 100px;
      height: 100px;
      background-color: rgba(0, 0, 0, 0.12);
      border: 2px solid rgba(0, 0, 0, 0.2);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
      z-index: 10;
    }

    .joystick-stick {
      width: 45px;
      height: 45px;
      background-color: rgba(0, 0, 0, 0.35);
      border-radius: 50%;
      position: absolute;
    }
  </style>
</head>
<body>

  <!-- 알 아이콘 버튼 -->
  <button class="egg-btn" id="openModal">🥚</button>

  <!-- 버튼 클릭 시 열리는 창 -->
  <div class="modal-overlay" id="modal">
    <div class="modal-content" id="modalContent">
      <!-- 왼쪽 위 빨간색 X 버튼 -->
      <button class="close-btn" id="closeModal">✕</button>

      <!-- 왼쪽 아래 스탯 UI -->
      <div class="stats-ui">
        <!-- 위쪽: 하늘색 신발 아이콘 + 파란색 속도 텍스트 -->
        <div class="stat-row">
          <span style="font-size:20px;">👟</span>
          <span class="stat-s" id="sText">S:10.0</span>
        </div>
        <!-- 아래쪽: 돈 아이콘 + 초록색 M:000 텍스트 -->
        <div class="stat-row">
          <span style="font-size:20px;">💵</span>
          <span class="stat-m" id="mText">M:000</span>
        </div>
      </div>

      <!-- 위쪽 수직 구조 월드 맵 -->
      <div class="world" id="world">
        <div class="fence"></div>
        <!-- 울타리 위쪽에 위치한 러닝머신 -->
        <div class="treadmill" id="treadmill">
          <div class="treadmill-screen">RUN</div>
          <div class="treadmill-belt"></div>
        </div>
      </div>

      <!-- 중앙 고정 캐릭터 -->
      <div class="character"></div>

      <!-- 오른쪽 아래 조이스틱 -->
      <div class="joystick-base" id="joyBase">
        <div class="joystick-stick" id="joyStick"></div>
      </div>
    </div>
  </div>

  <script>
    const openBtn = document.getElementById('openModal');
    const closeBtn = document.getElementById('closeModal');
    const modal = document.getElementById('modal');
    const world = document.getElementById('world');
    const mText = document.getElementById('mText');
    const sText = document.getElementById('sText');
    const treadmill = document.getElementById('treadmill');

    openBtn.addEventListener('click', () => modal.style.display = 'flex');
    closeBtn.addEventListener('click', () => modal.style.display = 'none');

    // 조이스틱 변수
    const joyBase = document.getElementById('joyBase');
    const joyStick = document.getElementById('joyStick');
    let isDragging = false;
    const maxRadius = 32;

    // 플레이어 이동 및 속도 관련 상태
    let cameraX = 0;
    let cameraY = 0;
    let moveX = 0;
    let moveY = 0;
    let speed = 10.0; // 기본 달리기 속도 (S)

    function handleStart() { isDragging = true; }
    function handleEnd() {
      isDragging = false;
      joyStick.style.transform = 'translate(0px, 0px)';
      moveX = 0;
      moveY = 0;
    }

    function handleMove(e) {
      if (!isDragging) return;
      const rect = joyBase.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      let deltaX = clientX - centerX;
      let deltaY = clientY - centerY;

      const distance = Math.hypot(deltaX, deltaY);
      if (distance > maxRadius) {
        deltaX = (deltaX / distance) * maxRadius;
        deltaY = (deltaY / distance) * maxRadius;
      }

      joyStick.style.transform = `translate(${deltaX}px, ${deltaY}px)`;

      // 현재 속도(speed) 비율에 맞춰 캐릭터 이동력 계산
      const speedFactor = speed / 3;
      moveX = (deltaX / maxRadius) * speedFactor;
      moveY = (deltaY / maxRadius) * speedFactor;
    }

    let lastTime = performance.now();

    // 메인 업데이트 루프
    function updateGame(now) {
      if (modal.style.display === 'flex') {
        const delta = (now - lastTime) / 1000; // 초 단위 시간 측정

        cameraX += moveX;
        cameraY -= moveY;

        if (cameraY < 0) cameraY = 0;
        if (cameraY > 2100) cameraY = 2100;

        world.style.transform = `translate(${-cameraX}px, ${cameraY}px)`;

        // 러닝머신 위에 캐릭터가 올라갔는지 충돌 체크
        // (카메라X/Y가 러닝머신 좌표 근처에 위치할 때)
        const treadX = 160; 
        const treadY = 120;
        const isOnTreadmill = Math.abs(cameraX - treadX) < 40 && Math.abs(cameraY - treadY) < 50;

        if (isOnTreadmill) {
          // 초당 0.5씩 속도 증가
          speed += 0.5 * delta;
        }

        // UI 텍스트 업데이트
        sText.innerText = `S:${speed.toFixed(1)}`;
        const currentM = Math.floor(cameraY / 10);
        mText.innerText = `M:${String(currentM).padStart(3, '0')}`;
      }
      lastTime = now;
      requestAnimationFrame(updateGame);
    }

    joyBase.addEventListener('mousedown', handleStart);
    window.addEventListener('mouseup', handleEnd);
    window.addEventListener('mousemove', handleMove);

    joyBase.addEventListener('touchstart', handleStart);
    window.addEventListener('touchend', handleEnd);
    window.addEventListener('touchmove', handleMove);

    requestAnimationFrame(updateGame);
  </script>

</body>
</html>
