<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>계란을 훔치다!</title>
  <style>
    body {
      background-color: #0f172a;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      margin: 0;
      padding: 10px;
      touch-action: manipulation;
    }
    .status-bar {
      display: flex;
      justify-content: space-around;
      background: #1e293b;
      padding: 10px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    canvas {
      background: #1e293b;
      border: 3px solid #f59e0b;
      border-radius: 12px;
      max-width: 95vw;
      max-height: 42vh;
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
    }
    .action-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
    }
    .btn-treadmill { background: #10b981; }
    .btn:active { transform: scale(0.98); opacity: 0.9; }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 55px);
      gap: 6px;
      justify-content: center;
      margin-top: 10px;
    }
    .ctrl-btn {
      width: 55px;
      height: 55px;
      font-size: 22px;
      background: #334155;
      color: white;
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px #1e293b;
    }
    .ctrl-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px #1e293b;
    }
    .empty { visibility: hidden; }
    #baseInfo {
      margin-top: 8px;
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>
<body>

  <h1>🥚 계란을 훔치다!</h1>

  <div class="status-bar">
    <div>⚡ 속도: <span id="speedVal">5</span></div>
    <div>🎒 들고 있는 알: <span id="holdingVal">없음</span></div>
  </div>

  <canvas id="gameCanvas" width="400" height="260"></canvas>

  <!-- 터치 조작 버튼 -->
  <div class="controls">
    <div class="empty"></div>
    <button class="ctrl-btn" ontouchstart="startMove('UP')" ontouchend="stopMove()" onmousedown="startMove('UP')" onmouseup="stopMove()">⬆️</button>
    <div class="empty"></div>
    <button class="ctrl-btn" ontouchstart="startMove('LEFT')" ontouchend="stopMove()" onmousedown="startMove('LEFT')" onmouseup="stopMove()">⬅️</button>
    <button class="ctrl-btn" ontouchstart="startMove('DOWN')" ontouchend="stopMove()" onmousedown="startMove('DOWN')" onmouseup="stopMove()">⬇️</button>
    <button class="ctrl-btn" ontouchstart="startMove('RIGHT')" ontouchend="stopMove()" onmousedown="startMove('RIGHT')" onmouseup="stopMove()">➡️</button>
  </div>

  <!-- 액션 패널 -->
  <div class="action-panel">
    <button class="btn btn-treadmill" onclick="runTreadmill()">🏃 런닝머신 타기<br>(속도 +2 업그레이드)</button>
    <button class="btn" onclick="hatchBaseEgg()">🐣 기지 알 부화시키기</button>
  </div>

  <div id="baseInfo">내 기지에 설치된 알: <span id="installedEgg">없음</span></div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let speed = 5;
    let holding = null;
    let installedEgg = null;

    // 실제 월드(맵) 좌표 상의 플레이어 위치
    const playerWorld = { x: 50, y: 130, size: 24 };
    const myBaseWorld = { x: 0, y: 80, w: 70, h: 100 };

    // 연속 이동 처리용
    let moveDir = null;

    // 알 데이터 (x좌표가 길게 펼쳐진 넓은 맵)
    const eggs = [
      { x: 200, y: 130, name: "기본 알", reqSpeed: 5, color: "#ffffff", pattern: "#cbd5e1" },
      { x: 450, y: 130, name: "정글 전갈 알 🦂", reqSpeed: 9, color: "#10b981", pattern: "#047857" },
      { x: 700, y: 130, name: "코스믹 알 🌌", reqSpeed: 15, color: "#a855f7", pattern: "#6b21a8" },
      { x: 950, y: 130, name: "🔥 피닉스 알", reqSpeed: 23, color: "#ef4444", pattern: "#b91c1c" }
    ];

    // 둥근 사각형 그리기 함수 (플레이어용)
    function drawRoundRect(x, y, width, height, radius, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + width, y, x + width, y + height, radius);
      ctx.arcTo(x + width, y + height, x, y + height, radius);
      ctx.arcTo(x, y + height, x, y, radius);
      ctx.arcTo(x, y, x + width, y, radius);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // 예쁜 계란 아이콘 합성 함수
    function drawEgg(x, y, mainColor, patternColor) {
      // 알 몸통
      ctx.fillStyle = mainColor;
      ctx.beginPath();
      ctx.ellipse(x, y, 14, 18, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // 알 점무늬 패턴
      ctx.fillStyle = patternColor;
      ctx.beginPath();
      ctx.arc(x - 4, y - 5, 3, 0, Math.PI * 2);
      ctx.arc(x + 5, y + 2, 4, 0, Math.PI * 2);
      ctx.arc(x - 2, y + 7, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // 메인 루프 (초당 60프레임 부드러운 애니메이션)
    function update() {
      // 이동 로직
      if (moveDir === 'UP') playerWorld.y -= speed * 0.6;
      if (moveDir === 'DOWN') playerWorld.y += speed * 0.6;
      if (moveDir === 'LEFT' && playerWorld.x > 15) playerWorld.x -= speed * 0.6;
      if (moveDir === 'RIGHT') playerWorld.x += speed * 0.6;

      // Y축 맵 경계선 제한
      if (playerWorld.y < 20) playerWorld.y = 20;
      if (playerWorld.y > 240) playerWorld.y = 240;

      // 카메라 오프셋 계산 (플레이어를 캔버스 중앙 200, 130에 고정)
      const cameraX = playerWorld.x - 200;
      const cameraY = playerWorld.y - 130;

      // 화면 지우기
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 격자 배경그리기 (움직임 효과 극대화)
      ctx.strokeStyle = "#334155";
      ctx.lineWidth = 1;
      const gridSize = 40;
      const startX = -(cameraX % gridSize);
      const startY = -(cameraY % gridSize);
      for (let x = startX; x < canvas.width; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = startY; y < canvas.height; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // 내 기지 그리기 (카메라 좌표 적용)
      const baseScreenX = myBaseWorld.x - cameraX;
      const baseScreenY = myBaseWorld.y - cameraY;
      ctx.fillStyle = "#1d4ed8";
      ctx.fillRect(baseScreenX, baseScreenY, myBaseWorld.w, myBaseWorld.h);
      ctx.fillStyle = "white";
      ctx.font = "bold 12px Arial";
      ctx.fillText("내 기지", baseScreenX + 12, baseScreenY + 55);

      // 알 목록 그리기 (카메라 좌표 적용)
      eggs.forEach(e => {
        const eggScreenX = e.x - cameraX;
        const eggScreenY = e.y - cameraY;

        drawEgg(eggScreenX, eggScreenY, e.color, e.pattern);

        ctx.fillStyle = "#cbd5e1";
        ctx.font = "11px Arial";
        ctx.fillText(`${e.name}`, eggScreenX - 25, eggScreenY + 30);
        ctx.fillText(`(속도 ${e.reqSpeed})`, eggScreenX - 20, eggScreenY + 44);
      });

      // 플레이어 그리기 (항상 화면 중앙 고정)
      drawRoundRect(200 - playerWorld.size/2, 130 - playerWorld.size/2, playerWorld.size, playerWorld.size, 8, "#f59e0b");

      // 충돌 검사
      checkCollisions();

      requestAnimationFrame(update);
    }

    function startMove(dir) { moveDir = dir; }
    function stopMove() { moveDir = null; }

    function checkCollisions() {
      // 알 훔치기
      eggs.forEach(e => {
        if (!holding) {
          const dist = Math.hypot(playerWorld.x - e.x, playerWorld.y - e.y);
          if (dist < 25) {
            if (speed >= e.reqSpeed) {
              holding = e;
              document.getElementById("holdingVal").innerText = e.name;
            } else {
              stopMove();
              alert(`이 알을 훔치려면 속도가 [${e.reqSpeed}] 이상이어야 합니다!\n런닝머신을 타세요!`);
              playerWorld.x -= 20; // 튕겨남
            }
          }
        }
      });

      // 기지로 돌아와 알 설치
      if (holding && playerWorld.x < myBaseWorld.x + myBaseWorld.w &&
          playerWorld.y > myBaseWorld.y && playerWorld.y < myBaseWorld.y + myBaseWorld.h) {
        installedEgg = holding.name;
        holding = null;
        document.getElementById("holdingVal").innerText = "없음";
        document.getElementById("installedEgg").innerText = installedEgg + " (부화 대기 중)";
        alert(`기지에 [${installedEgg}]를 성공적으로 설치했습니다!`);
      }
    }

    function runTreadmill() {
      speed += 2;
      document.getElementById("speedVal").innerText = speed;
      alert(`🏃 런닝머신을 탔습니다! 현재 속도: ${speed}`);
    }

    function hatchBaseEgg() {
      if (!installedEgg) {
        alert("기지에 설치된 알이 없습니다!");
        return;
      }
      alert(`🎉 [${installedEgg}] 부화 성공! 속도가 +3 증가합니다!`);
      speed += 3;
      document.getElementById("speedVal").innerText = speed;
      installedEgg = null;
      document.getElementById("installedEgg").innerText = "없음";
    }

    // 애니메이션 실행
    update();
  </script>
</body>
</html>
