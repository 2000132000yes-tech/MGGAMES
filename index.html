<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egg Game</title>
    <style>
        /* 하얀 배경 설정 */
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
        }

        /* 왼쪽 위 컨테이너 (버튼 + 아래 글씨) */
        .egg-container {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        /* 모서리가 뭉툭한 정사각형 버튼 */
        .egg-btn {
            width: 60px;
            height: 60px;
            background-color: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.08);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            outline: none;
        }

        /* 계란 아이콘 크기 */
        .egg-icon {
            font-size: 32px;
            user-select: none;
        }

        /* 클릭 시 커졌다 작아지는 애니메이션 */
        .egg-btn:active,
        .egg-btn.pop-animation {
            transform: scale(1.15);
        }

        /* 버튼 아래 검은색 작은 글씨 */
        .egg-label {
            font-size: 12px;
            color: #000000;
            font-weight: bold;
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="egg-container">
        <button class="egg-btn" id="eggButton" onclick="openNewTab()">
            <span class="egg-icon">🥚</span>
        </button>
        <span class="egg-label">계란 훔치기</span>
    </div>

    <script>
        function openNewTab() {
            const btn = document.getElementById('eggButton');
            
            // 1. 클릭 시 통통 튀는 애니메이션 실행
            btn.classList.add('pop-animation');
            
            // 2. 애니메이션이 보여진 뒤(0.15초 후) 새 탭에서 주소 열기
            setTimeout(() => {
                btn.classList.remove('pop-animation');
                window.open("https://2000132000yes-tech.github.io/Stealing-eggs/", "_blank");
            }, 150);
        }
    </script>

</body>
</html>
