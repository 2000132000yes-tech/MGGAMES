<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egg Game</title>
    <style>
        /* 하얀 배경 설정 */
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
        }

        /* 왼쪽 위 컨테이너 (버튼 + 아래 글씨) */
        .egg-container {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        /* 모서리가 뭉툭한 정사각형 버튼 */
        .egg-btn {
            width: 60px;
            height: 60px;
            background-color: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 16px; /* 끝이 뭉툭한 모서리 */
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.08);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            outline: none;
        }

        /* 계란 아이콘 크기 */
        .egg-icon {
            font-size: 32px;
            user-select: none;
        }

        /* 마우스 호버 시 기본 상태 유지 */
        .egg-btn:hover {
            background-color: #f5f5f5; /* 노란색 변화 제거 */
        }

        /* 버튼 클릭(누를 때) 및 액티브 시 애니메이션 효과 */
        .egg-btn:active,
        .egg-btn.pop-animation {
            transform: scale(1.15); /* 눌렀을 때 커짐 */
        }

        /* 버튼 아래 검은색 작은 글씨 */
        .egg-label {
            font-size: 12px;
            color: #000000;
            font-weight: bold;
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="egg-container">
        <button class="egg-btn" id="eggButton" onclick="triggerPopEffect()">
            <span class="egg-icon">🥚</span>
        </button>
        <span class="egg-label">계란 훔치기</span>
    </div>

    <script>
        function triggerPopEffect() {
            const btn = document.getElementById('eggButton');
            
            // 커졌다 작아지는 애니메이션 적용
            btn.classList.add('pop-animation');
            setTimeout(() => {
                btn.classList.remove('pop-animation');
            }, 150); // 0.15초 뒤 다시 원래 크기로 축소

            // 여기에 나중에 원하는 계란 훔치기 게임 로직을 추가하시면 됩니다.
        }
    </script>

</body>
</html>
