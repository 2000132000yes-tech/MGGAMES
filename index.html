<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>알 훔치기: 인큐베이터 멸망전</title>
  <style>
    body {
      background-color: #121212;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 10px;
    }
    .status {
      background: #1f1f1f;
      padding: 10px;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 10px;
    }
    canvas {
      background: #2a2a2a;
      border: 3px solid #ff0055;
      border-radius: 10px;
      max-width: 95vw;
      max-height: 40vh;
    }
    .incubator-panel {
      background: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 10px;
      padding: 10px;
      margin-top: 10px;
    }
    .btn {
      background: #ff0055;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      font-weight: bold;
      margin: 5px;
    }
    .btn-upgrade { background: #0284c7; }
    .btn:active { opacity: 0.8; }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 50px);
      gap: 5px;
      justify-content: center;
      margin-top: 10px;
    }
    .ctrl-btn {
      width: 50px;
      height: 50px;
      font-size: 20px;
      background: #334155;
      color: white;
      border: none;
      border-radius: 8px;
    }
    .empty { visibility: hidden; }
    #inventory {
      margin-top: 10px;
      font-size: 14px;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <h1>🥚 알 훔치기: 인큐베이터 멸망전</h1>

  <div class="status">
    💎 보석: <span id="gems">0</span>개 | 🎒 가방 알: <span id="holdingEgg">없음</span>
  </div>

  <canvas id="gameCanvas" width="400" height="250"></canvas>

  <!-- 조작 버튼 -->
  <div class="controls">
    <div class="empty"></div>
    <button class="ctrl-btn" onclick="move('UP')">⬆️</button>
    <div class="empty"></div>
    <button class="ctrl-btn" onclick="move('LEFT')">⬅️</button>
    <button class="ctrl-btn" onclick="move('DOWN')">⬇️</button>
    <button class="ctrl-btn" onclick="move('RIGHT')">➡️</button>
  </div>

  <!-- 인큐베이터 시스템 (영상의 메인 요소) -->
  <div class="incubator-panel">
    <h3>🔥 인큐베이터 (확률 강회)</h3>
    <p>현재 스피릿 블룸 성공 확률: <b id="successRate">5</b>%</p>
    <button class="btn btn-upgrade" onclick="upgradeRate()">✨ 확률 10% 증가 (보석 50개)</button>
    <button class="btn" onclick="hatchEgg()">🚀 멸망전 알 까기!</button>
  </div>

  <div id="inventory">획득한 전설 펫: <span id="petList">없음</span></div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let gems = 0;
    let holding = null;
    let successRate = 5;
    let pets = [];

    const player = { x: 200, y: 200, size: 15 };
    const myBase = { x: 170, y: 180, w: 60, h: 60 };

    // 맵에 젠되는 알 종류
    let eggsOnMap = [
      { x: 50, y: 50, name: "일반 알", color: "#ffffff", val: 10 },
      { x: 350, y: 50, name: "희귀 화산 알", color: "#ff4500", val: 50 },
      { x: 200, y: 40, name: "👑 영원한 알", color: "#ffd700", val: 200 }
    ];

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 내 기지
      ctx.fillStyle = "#0284c7";
      ctx.fillRect(myBase.x, myBase.y, myBase.w, myBase.h);
      ctx.fillStyle = "white";
      ctx.font = "12px Arial";
      ctx.fillText("내 기지", myBase.x + 12, myBase.y + 35);

      // 알 그리기
      eggsOnMap.forEach(e => {
        if (e.x > 0) {
          ctx.fillStyle = e.color;
          ctx.beginPath();
          ctx.arc(e.x, e.y, 12, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // 플레이어
      ctx.fillStyle = "#ff0055";
      ctx.fillRect(player.x - 10, player.y - 10, 20, 20);

      checkCollisions();
    }

    function move(dir) {
      const spd = 12;
      if (dir === 'UP' && player.y > 15) player.y -= spd;
      if (dir === 'DOWN' && player.y < canvas.height - 15) player.y += spd;
      if (dir === 'LEFT' && player.x > 15) player.x -= spd;
      if (dir === 'RIGHT' && player.x < canvas.width - 15) player.x += spd;
      draw();
    }

    function checkCollisions() {
      // 알 줍기
      eggsOnMap.forEach(e => {
        if (e.x > 0 && !holding) {
          const dist = Math.hypot(player.x - e.x, player.y - e.y);
          if (dist < 25) {
            holding = e;
            document.getElementById("holdingEgg").innerText = e.name;
            e.x = -100; // 맵에서 숨김
          }
        }
      });

      // 기지로 알 가져오기
      if (holding && player.x > myBase.x && player.x < myBase.x + myBase.w &&
          player.y > myBase.y && player.y < myBase.y + myBase.h) {
        gems += holding.val;
        document.getElementById("gems").innerText = gems;
        
        // 3초 뒤 알 재요청
        const respawnEgg = holding;
        setTimeout(() => {
          if(respawnEgg.name === "일반 알") respawnEgg.x = 50;
          if(respawnEgg.name === "희귀 화산 알") respawnEgg.x = 350;
          if(respawnEgg.name === "👑 영원한 알") respawnEgg.x = 200;
          draw();
        }, 4000);

        holding = null;
        document.getElementById("holdingEgg").innerText = "인큐베이터 장전 완료!";
      }
    }

    function upgradeRate() {
      if (gems >= 50 && successRate < 85) {
        gems -= 50;
        successRate += 10;
        document.getElementById("gems").innerText = gems;
        document.getElementById("successRate").innerText = successRate;
      } else if (successRate >= 85) {
        alert("최대 확률 달성!");
      } else {
        alert("보석이 부족합니다!");
      }
    }

    function hatchEgg() {
      const rand = Math.random() * 100;
      if (rand < successRate) {
        alert("🔥 대성공! [스피릿 블룸 드래곤 🐉] 획득!");
        pets.push("스피릿 블룸 🐉");
      } else {
        alert("😭 실패... [일반 블루 타이거 🐯] 획득");
        pets.push("일반 타이거 🐯");
      }
      document.getElementById("petList").innerText = pets.join(", ");
      // 확률 초기화
      successRate = 5;
      document.getElementById("successRate").innerText = successRate;
    }

    draw();
  </script>
</body>
</html>
